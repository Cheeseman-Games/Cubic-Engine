[package]
name = "cubic-editor"
description = "Desktop editor shell for cubic games"
version.workspace = true
edition.workspace = true

# The editor is desktop-only for now. eframe can target wasm later, but pinning
# these under `not(target_arch = "wasm32")` keeps the workspace's
# `wasm32-unknown-unknown` build green and skips fetching the eframe tree for it.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pin egui/eframe and egui_dock together: eframe ships its own wgpu backend, and
# `cubic-render` drives the same wgpu major. 0.36 and 0.21 sit on wgpu 30.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
# What a project *is* (game.toml, the generator) lives in the CLI, so the editor
# discovers and creates projects by the same rules as `cubic-cli new` instead of
# restating them.
cubic-cli = { path = "../cubic-cli" }
# The scene model: opening and saving `.rsn` files needs `Scene` and the world
# snapshotting behind it.
cubic-core = { path = "../cubic-core", features = ["scene"] }
# The viewport renders through the engine's wgpu backend into a texture egui
# samples: eframe's device/queue drive `WgpuRenderer2d` via `Offscreen2d`.
cubic-render = { path = "../cubic-render" }
# PNG (the engine's own format) plus JPEG for previews; decoders only.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Native Open/New Project dialogs.
rfd = "0.17"

[lints]
workspace = true